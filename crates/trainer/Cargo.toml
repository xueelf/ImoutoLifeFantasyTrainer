[package]
name = "imouto-life-fantasy-trainer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "妹相随～黑白世界的缤纷冒险～修改器"

# 保持既有 Release 文件名；Cargo Book 允许为兼容旧二进制名使用非 kebab-case。
[[bin]]
name = "ImoutoLifeFantasyTrainer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
fastrand = "2"
global-hotkey = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico"] }
include_dir = "0.7"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
